name: Release 0.5.2 Live Proof

on:
  workflow_dispatch:
    inputs:
      authorized_runner_commit:
        description: Exact ORCH4-authorized runner commit
        required: true
        type: string
      proof_run_id:
        description: Exact proof run ID to execute
        required: true
        type: string
      authorized_proof_run_id:
        description: Exact ORCH4-authorized proof run ID
        required: true
        type: string
      source_contract_hash:
        description: ORCH4-frozen source contract hash
        required: true
        type: string
      discovery_plan_hash:
        description: ORCH4-frozen discovery plan hash
        required: true
        type: string
      selector_config_hash:
        description: ORCH4-frozen selector config hash
        required: true
        type: string
      max_attempted_calls:
        description: ORCH4-frozen attempted-call ceiling
        required: true
        type: string
      max_unique_candidates:
        description: ORCH4-frozen unique-candidate ceiling
        required: true
        type: string
      per_call_timeout_ms:
        description: ORCH4-frozen per-call timeout
        required: true
        type: string
      whole_proof_timeout_ms:
        description: ORCH4-frozen whole-proof timeout
        required: true
        type: string

permissions:
  contents: read

jobs:
  deterministic-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE052_ARTIFACT_DIR: release052-live-artifact
      RELEASE052_AUTHORIZED_RUNNER_COMMIT: ${{ inputs.authorized_runner_commit }}
      RELEASE052_PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      RELEASE052_AUTHORIZED_PROOF_RUN_ID: ${{ inputs.authorized_proof_run_id }}
      RELEASE052_EXPECTED_SOURCE_CONTRACT_HASH: ${{ inputs.source_contract_hash }}
      RELEASE052_EXPECTED_DISCOVERY_PLAN_HASH: ${{ inputs.discovery_plan_hash }}
      RELEASE052_EXPECTED_SELECTOR_CONFIG_HASH: ${{ inputs.selector_config_hash }}
      RELEASE052_EXPECTED_MAX_ATTEMPTED_CALLS: ${{ inputs.max_attempted_calls }}
      RELEASE052_EXPECTED_MAX_UNIQUE_CANDIDATES: ${{ inputs.max_unique_candidates }}
      RELEASE052_EXPECTED_PER_CALL_TIMEOUT_MS: ${{ inputs.per_call_timeout_ms }}
      RELEASE052_EXPECTED_WHOLE_PROOF_TIMEOUT_MS: ${{ inputs.whole_proof_timeout_ms }}
    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorized_runner_commit }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Pre-dispatch authority and config validation
        id: gate
        run: npm run proof:live -- --validate-only
      - name: Execute deterministic live proof
        id: proof
        continue-on-error: true
        run: npm run proof:live
      - name: Always reconcile outstanding reservations
        if: always()
        run: |
          if [ -f "$RELEASE052_ARTIFACT_DIR/.proof-config.json" ]; then
            npm run proof:live -- --reconcile-only
          else
            echo "proof was not initialized; no reservations exist to reconcile"
          fi
      - name: Always finalize sanitized artifact
        if: always()
        run: |
          if [ -f "$RELEASE052_ARTIFACT_DIR/.proof-config.json" ]; then
            CLASSIFICATION="${{ steps.proof.outputs.classification }}"
            if [ -z "$CLASSIFICATION" ]; then
              CLASSIFICATION=BLOCKED
            fi
            node scripts/finalize-release052-proof.mjs \
              --output-dir "$RELEASE052_ARTIFACT_DIR" \
              --classification "$CLASSIFICATION"
          else
            echo "proof was blocked before initialization; no artifact to finalize"
          fi
      - name: Always upload sanitized proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-0.5.2-live-proof-${{ inputs.authorized_runner_commit }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            release052-live-artifact/sanitized-call-ledger.jsonl
            release052-live-artifact/proof-manifest.json
            release052-live-artifact/artifact-hash.txt
      - name: Propagate execution failure after preservation
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "pre-dispatch authority validation failed"
            exit 1
          fi
          if [ "${{ steps.proof.outcome }}" != "success" ]; then
            echo "live proof execution failed after artifact preservation"
            exit 1
          fi
          echo "live proof classification: ${{ steps.proof.outputs.classification }}"
