name: Release 0.5.3 Final Source Proof

on:
  workflow_dispatch:
    inputs:
      authorized_runner_commit:
        description: Exact ORCH4-authorized runner commit
        required: true
        type: string
      proof_run_id:
        description: Exact proof run ID
        required: true
        type: string
      authorized_proof_run_id:
        description: Exact ORCH4-authorized proof run ID
        required: true
        type: string
      source_contract_hash:
        description: Frozen source contract hash
        required: true
        type: string
      event_universe_hash:
        description: Frozen independent event-universe hash
        required: true
        type: string
      query_plan_hash:
        description: Frozen provider-neutral query-plan hash
        required: true
        type: string
      semantic_bundle_hash:
        description: Frozen semantic-bundle hash
        required: true
        type: string
      quality_screen_config_hash:
        description: Frozen quality-screen config hash
        required: true
        type: string
      diagnostic_contract_hash:
        description: Frozen parser-diagnostic contract hash
        required: true
        type: string
      max_search_calls:
        description: Frozen search call ceiling
        required: true
        type: string
      max_get_instrument_calls:
        description: Frozen get_instrument call ceiling
        required: true
        type: string
      max_snapshot_calls:
        description: Frozen snapshot call ceiling
        required: true
        type: string
      max_total_attempts:
        description: Frozen total Data-returning call ceiling
        required: true
        type: string
      max_unique_candidates:
        description: Frozen unique-candidate ceiling
        required: true
        type: string
      per_call_timeout_ms:
        description: Frozen per-call timeout
        required: true
        type: string
      whole_proof_timeout_ms:
        description: Frozen whole-proof timeout
        required: true
        type: string
      workflow_identity:
        description: Frozen workflow identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  deterministic-final-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE053_ARTIFACT_DIR: release053-final-proof-artifact
      RELEASE053_AUTHORIZED_RUNNER_COMMIT: ${{ inputs.authorized_runner_commit }}
      RELEASE053_PROOF_RUN_ID: ${{ inputs.proof_run_id }}
      RELEASE053_AUTHORIZED_PROOF_RUN_ID: ${{ inputs.authorized_proof_run_id }}
      RELEASE053_EXPECTED_SOURCE_CONTRACT_HASH: ${{ inputs.source_contract_hash }}
      RELEASE053_EXPECTED_EVENT_UNIVERSE_HASH: ${{ inputs.event_universe_hash }}
      RELEASE053_EXPECTED_QUERY_PLAN_HASH: ${{ inputs.query_plan_hash }}
      RELEASE053_EXPECTED_SEMANTIC_BUNDLE_HASH: ${{ inputs.semantic_bundle_hash }}
      RELEASE053_EXPECTED_QUALITY_SCREEN_CONFIG_HASH: ${{ inputs.quality_screen_config_hash }}
      RELEASE053_EXPECTED_DIAGNOSTIC_CONTRACT_HASH: ${{ inputs.diagnostic_contract_hash }}
      RELEASE053_EXPECTED_MAX_SEARCH_CALLS: ${{ inputs.max_search_calls }}
      RELEASE053_EXPECTED_MAX_GET_INSTRUMENT_CALLS: ${{ inputs.max_get_instrument_calls }}
      RELEASE053_EXPECTED_MAX_SNAPSHOT_CALLS: ${{ inputs.max_snapshot_calls }}
      RELEASE053_EXPECTED_MAX_TOTAL_ATTEMPTS: ${{ inputs.max_total_attempts }}
      RELEASE053_EXPECTED_MAX_UNIQUE_CANDIDATES: ${{ inputs.max_unique_candidates }}
      RELEASE053_EXPECTED_PER_CALL_TIMEOUT_MS: ${{ inputs.per_call_timeout_ms }}
      RELEASE053_EXPECTED_WHOLE_PROOF_TIMEOUT_MS: ${{ inputs.whole_proof_timeout_ms }}
      RELEASE053_EXPECTED_WORKFLOW_IDENTITY: ${{ inputs.workflow_identity }}
    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.authorized_runner_commit }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Pre-dispatch authority and freeze validation
        id: gate
        run: npm run proof:release053 -- --validate-only
      - name: Execute deterministic final source proof
        id: proof
        continue-on-error: true
        run: npm run proof:release053
      - name: Always reconcile outstanding reservations
        if: always()
        run: |
          if [ -f "$RELEASE053_ARTIFACT_DIR/.proof-config.json" ]; then
            npm run proof:release053 -- --reconcile-only
          else
            echo "proof was blocked before initialization; no reservations exist to reconcile"
          fi
      - name: Always finalize integrity-bound artifact
        if: always()
        run: |
          if [ -f "$RELEASE053_ARTIFACT_DIR/.proof-config.json" ] && [ -f "$RELEASE053_ARTIFACT_DIR/proof-summary.json" ]; then
            CLASSIFICATION="${{ steps.proof.outputs.classification }}"
            if [ -z "$CLASSIFICATION" ]; then
              CLASSIFICATION=BLOCKED
            fi
            node scripts/finalize-release053-proof.mjs               --output-dir "$RELEASE053_ARTIFACT_DIR"               --classification "$CLASSIFICATION"
          else
            echo "proof was blocked before durable summary initialization; no artifact to finalize"
          fi
      - name: Always upload sanitized proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-0.5.3-final-source-proof-${{ inputs.authorized_runner_commit }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            release053-final-proof-artifact/sanitized-call-ledger.jsonl
            release053-final-proof-artifact/sanitized-schema-diagnostics.jsonl
            release053-final-proof-artifact/proof-summary.json
            release053-final-proof-artifact/proof-manifest.json
            release053-final-proof-artifact/artifact-hash.txt
            release053-final-proof-artifact/release053-proof-manifest.json
            release053-final-proof-artifact/release053-artifact-hash.txt
      - name: Propagate execution failure after preservation
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "pre-dispatch authority validation failed"
            exit 1
          fi
          if [ "${{ steps.proof.outcome }}" != "success" ]; then
            echo "final source proof execution failed after artifact preservation"
            exit 1
          fi
          echo "final source proof classification: ${{ steps.proof.outputs.classification }}"
